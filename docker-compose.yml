services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-rental}
      POSTGRES_USER: ${DB_USER:-rental}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rental}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rental} -d ${DB_NAME:-rental}"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - media:/app/media
    ports:
      - "127.0.0.1:8200:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
