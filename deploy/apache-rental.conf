# Apache reverse proxy для «Проката оборудования».
# Установка (от root):
#   cp apache-rental.conf /etc/apache2/sites-available/zz-rental.conf
#   a2ensite zz-rental && apache2ctl configtest && systemctl reload apache2
#   /snap/bin/certbot --apache -d rental.37.194.184.235.sslip.io
# certbot добавит HTTPS-хост (zz-rental-le-ssl.conf) и редирект HTTP -> HTTPS.
# Префикс "zz-" нужен, чтобы сайтом по умолчанию для *:443 оставался filebrowser.
<VirtualHost *:80>
    ServerName rental.37.194.184.235.sslip.io
    ProxyPreserveHost On
    ProxyRequests Off
    # Схема берётся из самого запроса: certbot копирует этот блок в HTTPS-хост, и там будет https,
    # а по обычному HTTP Django не примет запрос за защищённый.
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    # Фото оборудования до 5 МБ плюс поля формы.
    LimitRequestBody 10485760
    ProxyPass / http://127.0.0.1:8210/
    ProxyPassReverse / http://127.0.0.1:8210/
    ErrorLog ${APACHE_LOG_DIR}/rental-error.log
    CustomLog ${APACHE_LOG_DIR}/rental-access.log combined
</VirtualHost>
