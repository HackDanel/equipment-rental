{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="narrow card">
  <h1>Вход</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn--wide">Войти</button>
  </form>
  <p class="muted">Нет аккаунта? <a href="{% url 'accounts:register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Зарегистрироваться</a></p>
</div>
{% endblock %}
