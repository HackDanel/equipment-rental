{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="narrow card">
  <h1>Регистрация</h1>
  <p class="muted">После регистрации можно бронировать оборудование и следить за арендами в личном кабинете.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn--wide">Создать аккаунт</button>
  </form>
  <p class="muted">Уже есть аккаунт? <a href="{% url 'accounts:login' %}">Войти</a></p>
</div>
{% endblock %}
